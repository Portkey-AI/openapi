name: Trigger Mintlify Update

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: mintlify-update
  cancel-in-progress: true

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPEC_URL: https://raw.githubusercontent.com/Portkey-AI/openapi/refs/heads/master/openapi.yaml
      MINTLIFY_TOKEN: ${{ secrets.MINTLIFY_TOKEN }}
      MINTLIFY_PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      # Mintlify builds from SPEC_URL, which raw.githubusercontent.com caches for up to 300s.
      - name: Wait for the raw spec cache to expire
        if: github.event_name == 'push'
        run: sleep 310

      - name: Check that the raw spec matches this commit
        run: |
          expected=$(sha256sum openapi.yaml | cut -d' ' -f1)
          actual=$(curl -sSfL "$SPEC_URL" | sha256sum | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "::error::$SPEC_URL does not match openapi.yaml at $GITHUB_SHA"
            exit 1
          fi

      - name: Trigger Mintlify update
        id: trigger
        run: |
          resp=$(curl -sS --fail-with-body --request POST \
            --url "https://api.mintlify.com/v1/project/update/$MINTLIFY_PROJECT_ID" \
            --header "Authorization: Bearer $MINTLIFY_TOKEN")
          status_id=$(jq -r '.statusId // empty' <<<"$resp")
          if [ -z "$status_id" ]; then
            echo "::error::No statusId in Mintlify response: $resp"
            exit 1
          fi
          echo "status_id=$status_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Mintlify deployment
        env:
          STATUS_ID: ${{ steps.trigger.outputs.status_id }}
        run: |
          for _ in $(seq 1 60); do
            resp=$(curl -sS --fail-with-body \
              --url "https://api.mintlify.com/v1/project/update-status/$STATUS_ID" \
              --header "Authorization: Bearer $MINTLIFY_TOKEN")
            status=$(jq -r '.status' <<<"$resp")
            echo "Mintlify status: $status"
            case "$status" in
              success) exit 0 ;;
              failure)
                jq -r '.summary // empty, (.logs // [])[]' <<<"$resp"
                echo "::error::Mintlify deployment failed"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "::error::Mintlify deployment did not finish in 20 minutes"
          exit 1
